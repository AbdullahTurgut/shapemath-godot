<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 432 432" width="432" height="432">
  <defs>
    <linearGradient id="fgTileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4de1f7"/>
      <stop offset="100%" stop-color="#1fa4cc"/>
    </linearGradient>
    <linearGradient id="fgAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ffb300"/>
    </linearGradient>
    <filter id="fgGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Main Geometric Shape (Isometric Diamond) sized within 220x220 safe zone -->
  <g filter="url(#fgGlow)">
    <polygon points="216,112 320,216 216,320 112,216" fill="#0e566c" opacity="0.6"/>
    <polygon points="216,104 316,204 216,304 116,204" fill="url(#fgTileGrad)"/>
    <polygon points="216,104 316,204 216,204 116,204" fill="#ffffff" opacity="0.18"/>
  </g>

  <!-- Inner Dark Core Plate -->
  <polygon points="216,144 280,208 216,272 152,208" fill="#151922"/>
  <polygon points="216,144 280,208 216,272 152,208" fill="none" stroke="#2c374d" stroke-width="3"/>

  <!-- Central Math Operator (+) in Brand Gold -->
  <g fill="url(#fgAccentGrad)">
    <rect x="202" y="172" width="28" height="72" rx="8"/>
    <rect x="180" y="194" width="72" height="28" rx="8"/>
  </g>

  <!-- Corner Accents -->
  <circle cx="216" cy="104" r="8" fill="#4de1f7"/>
  <circle cx="316" cy="204" r="8" fill="#4de1f7"/>
  <circle cx="216" cy="304" r="8" fill="#4de1f7"/>
  <circle cx="116" cy="204" r="8" fill="#4de1f7"/>
</svg>
