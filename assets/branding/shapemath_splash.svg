<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="splashTileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4de1f7"/>
      <stop offset="100%" stop-color="#1fa4cc"/>
    </linearGradient>
    <linearGradient id="splashAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ffb300"/>
    </linearGradient>
    <filter id="splashGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Central Emblem -->
  <g transform="translate(44, 0)">
    <!-- Main Geometric Diamond Shape -->
    <g filter="url(#splashGlow)">
      <polygon points="256,108 360,212 256,316 152,212" fill="#0e566c" opacity="0.6"/>
      <polygon points="256,100 356,200 256,300 156,200" fill="url(#splashTileGrad)"/>
      <polygon points="256,100 356,200 256,200 156,200" fill="#ffffff" opacity="0.18"/>
    </g>

    <!-- Inner Core Plate -->
    <polygon points="256,140 320,204 256,268 192,204" fill="#151922"/>
    <polygon points="256,140 320,204 256,268 192,204" fill="none" stroke="#2c374d" stroke-width="3"/>

    <!-- Central Math Operator (+) -->
    <g fill="url(#splashAccentGrad)">
      <rect x="242" y="168" width="28" height="72" rx="8"/>
      <rect x="220" y="190" width="72" height="28" rx="8"/>
    </g>

    <!-- Corner Accents -->
    <circle cx="256" cy="100" r="8" fill="#4de1f7"/>
    <circle cx="356" cy="200" r="8" fill="#4de1f7"/>
    <circle cx="256" cy="300" r="8" fill="#4de1f7"/>
    <circle cx="156" cy="200" r="8" fill="#4de1f7"/>
  </g>

  <!-- Typography -->
  <text x="300" y="410" text-anchor="middle" font-family="sans-serif" font-size="54" font-weight="bold" fill="#ffffff" letter-spacing="2">ShapeMath</text>
  <text x="300" y="465" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#8d99ae" letter-spacing="1">Matematik &amp; Şekil Bulmacaları</text>
</svg>
