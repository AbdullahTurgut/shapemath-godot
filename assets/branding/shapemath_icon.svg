<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e222d"/>
      <stop offset="100%" stop-color="#12151d"/>
    </linearGradient>
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4de1f7"/>
      <stop offset="100%" stop-color="#1fa4cc"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ffb300"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#2c3345" stroke-width="4"/>

  <!-- Subtle Geometric Grid Accent -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#252b3b" stroke-width="3" stroke-dasharray="8 8"/>
  <polygon points="256,96 396,256 256,416 116,256" fill="none" stroke="#232938" stroke-width="4"/>

  <!-- Main Geometric Shape (Isometric Diamond / Tile) -->
  <g filter="url(#glow)">
    <polygon points="256,128 384,256 256,384 128,256" fill="#0e566c" opacity="0.6"/>
    <polygon points="256,120 380,244 256,368 132,244" fill="url(#tileGrad)"/>
    <polygon points="256,120 380,244 256,244 132,244" fill="#ffffff" opacity="0.18"/>
  </g>

  <!-- Inner Dark Core Plate -->
  <polygon points="256,168 336,248 256,328 176,248" fill="#151922"/>
  <polygon points="256,168 336,248 256,328 176,248" fill="none" stroke="#2c374d" stroke-width="4"/>

  <!-- Central Math Operator (+) in Brand Gold -->
  <g fill="url(#accentGrad)">
    <rect x="238" y="202" width="36" height="92" rx="10"/>
    <rect x="210" y="230" width="92" height="36" rx="10"/>
  </g>

  <!-- Corner Accents -->
  <circle cx="256" cy="120" r="10" fill="#4de1f7"/>
  <circle cx="380" cy="244" r="10" fill="#4de1f7"/>
  <circle cx="256" cy="368" r="10" fill="#4de1f7"/>
  <circle cx="132" cy="244" r="10" fill="#4de1f7"/>
</svg>
